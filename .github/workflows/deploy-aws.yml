name: Deploy to AWS ECS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag
        required: false
        default: latest

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: shogunx-api
  ECS_CLUSTER: shogunx-api
  ECS_SERVICE: shogunx-api-web
  ECS_TASK_DEFINITION_FAMILY: shogunx-api
  CONTAINER_NAME: web

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Requires GitHub repository variables (Settings → Secrets and variables → Actions):
    # AWS_ROLE_ARN, ECS_EXECUTION_ROLE_ARN, ECS_TASK_ROLE_ARN,
    # SECRET_*_ARN (4), ECS_SUBNETS, ECS_SECURITY_GROUPS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          IMAGE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.image_tag || github.sha }}
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Render task definition
        env:
          AWS_ACCOUNT_ID: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
          ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          ECS_TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
          SECRET_RAILS_MASTER_KEY_ARN: ${{ vars.SECRET_RAILS_MASTER_KEY_ARN }}
          SECRET_DATABASE_URL_ARN: ${{ vars.SECRET_DATABASE_URL_ARN }}
          SECRET_OPENAI_API_KEY_ARN: ${{ vars.SECRET_OPENAI_API_KEY_ARN }}
          SECRET_SHOGUNX_API_KEY_ARN: ${{ vars.SECRET_SHOGUNX_API_KEY_ARN }}
        run: |
          export AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID%%.*}"
          deploy/aws/render-task-definition.sh > task-definition-rendered.json

      - name: Register task definition
        id: register
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "arn=${ARN}" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
          ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
        run: deploy/aws/migrate.sh

      - name: Roll out ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register.outputs.arn }}" \
            --force-new-deployment \
            --region "$AWS_REGION"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
